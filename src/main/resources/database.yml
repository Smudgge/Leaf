#
# Author : Smudge
# File: database.yml
# Last Changed: 6.0.0
# Description: Contains the database settings.
#
# ⚠ Changing these values requires a proxy restart. ⚠

enabled: false

# ---------------------------------------
#           ✜ Database Settings ✜
# ---------------------------------------
should_reconnect_every_cycle: true
reconnect_cooldown_millis: 2000
will_reconnect: true
time_between_requests_millis: 100
max_requests_pending: 40

# ---------------------------------------
#           ✜ Database Type ✜
# ---------------------------------------
# This type of database saves the data
# to a file located in this folder.
sqlite:
  enabled: true
  path: "plugins/CozyJoinLeave/database.sqlite3"

# This type of database saves data on an
# external server or the cloud.
mysql:
  enabled: false
  connection_string: "address:port"
  database_name: ""
  username: ""
  password: ""

# This type of database saves data to the cloud.
mongo:
  enabled: false
  connection_string: "" # example: "mongodb+srv://Name:Password@Name.?.mongodb.net/?retryWrites=true&w=majority"
  database_name: ""

# ---------------------------------------
#             ✜ Leaf Settings ✜
# ---------------------------------------
# The maximum amount of history that will
# be saved in the database per player.
player_history_limit: 20

# The maximum number of messages that will
# be saved in the database per player.
message_limit: 100