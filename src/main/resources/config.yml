#
# ✓ Simple Whitelist ✓
#
# Contains the players that are whitelisted on this server.
# The list can contain the players name, when they log on it
# will be converted to there uuid. Uuids don't change when players
# change there minecraft names.
whitelist:
  enabled: false
  reason: "&fYou are not &cwhitelisted &fon this server."
  players: []