#
# ❐ Logging ❐
#
# Should the plugin log everything?
# It's recommended to keep these set to true except debug unless you are
# experienced with using the leaf plugin and prefer less logging.
logging:
  debug_mode: false
  header: true
  b_stats: true
  commands: true

# ▗▖  ▗▖ ▗▄▖ ▗▖  ▗▖▗▄▄▄▖ ▗▄▄▖▗▖ ▗▖
# ▐▌  ▐▌▐▌ ▐▌▐▛▚▖▐▌  █  ▐▌   ▐▌ ▐▌
# ▐▌  ▐▌▐▛▀▜▌▐▌ ▝▜▌  █   ▝▀▚▖▐▛▀▜▌
#  ▝▚▞▘ ▐▌ ▐▌▐▌  ▐▌▗▄█▄▖▗▄▄▞▘▐▌ ▐▌
#
# ✿ Vanish Support ✿
#
# The permission used to check if a player is able to vanish.
# To support almost every vanish plugin, this plugin is quite crafty.
# It uses the tab list and the players permissions to check if they are vanished.
vanishable_permission: "leaf.vanishable"

# Sometimes a vanishable player will be on an empty server.
# Unfortunately we cannot check if the player is vanished or not.
# Because of this we assume the player is vanished.
#
# Setting this to true will let other vanishable players see
# vanishable players regardless of the rank.
#
# Defaults to false.
can_vanishable_see_vanishable: false

